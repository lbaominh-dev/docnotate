services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docnotate
    restart: unless-stopped
    ports:
      - "3535:80"
    environment:
      RAILS_ENV: production
      DOCNOTATE_MODE: "${DOCNOTATE_MODE:-cloud}"
      RAILS_FORCE_SSL: "false"
      RAILS_ASSUME_SSL: "false"
      SECRET_KEY_BASE: "${SECRET_KEY_BASE:-changeme_replace_with_openssl_rand_hex_64}"
    volumes:
      - docnotate_storage:/rails/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/up || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  docnotate_storage:
